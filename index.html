<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product CRUD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css"
      rel="stylesheet"
      integrity="sha256-V6lu+OdYNKTKTsVFBuQsyIlDiRWiOmtC8VQ8Lzdm2i4="
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="icon.png" type="image/x-icon" />
  </head>

  <body>
    <div class="container-fluid bg-light p-0">
      <header class="h2 py-2 m-0 text-center bg-warning text-white">
        Product Manager
      </header>
      <div class="layout d-flex flex-column">
        <div
          class="functions bg-dark align-content-center justify-item-center d-flex"
        >
          <button
            type="button"
            class="btn btn-primary p-2 my-2 mx-3"
            id="btnNewProduct"
          >
            New
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-plus-circle-dotted"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 0q-.264 0-.523.017l.064.998a7 7 0 0 1 .918 0l.064-.998A8 8 0 0 0 8 0M6.44.152q-.52.104-1.012.27l.321.948q.43-.147.884-.237L6.44.153zm4.132.271a8 8 0 0 0-1.011-.27l-.194.98q.453.09.884.237zm1.873.925a8 8 0 0 0-.906-.524l-.443.896q.413.205.793.459zM4.46.824q-.471.233-.905.524l.556.83a7 7 0 0 1 .793-.458zM2.725 1.985q-.394.346-.74.74l.752.66q.303-.345.648-.648zm11.29.74a8 8 0 0 0-.74-.74l-.66.752q.346.303.648.648zm1.161 1.735a8 8 0 0 0-.524-.905l-.83.556q.254.38.458.793l.896-.443zM1.348 3.555q-.292.433-.524.906l.896.443q.205-.413.459-.793zM.423 5.428a8 8 0 0 0-.27 1.011l.98.194q.09-.453.237-.884zM15.848 6.44a8 8 0 0 0-.27-1.012l-.948.321q.147.43.237.884zM.017 7.477a8 8 0 0 0 0 1.046l.998-.064a7 7 0 0 1 0-.918zM16 8a8 8 0 0 0-.017-.523l-.998.064a7 7 0 0 1 0 .918l.998.064A8 8 0 0 0 16 8M.152 9.56q.104.52.27 1.012l.948-.321a7 7 0 0 1-.237-.884l-.98.194zm15.425 1.012q.168-.493.27-1.011l-.98-.194q-.09.453-.237.884zM.824 11.54a8 8 0 0 0 .524.905l.83-.556a7 7 0 0 1-.458-.793zm13.828.905q.292-.434.524-.906l-.896-.443q-.205.413-.459.793zm-12.667.83q.346.394.74.74l.66-.752a7 7 0 0 1-.648-.648zm11.29.74q.394-.346.74-.74l-.752-.66q-.302.346-.648.648zm-1.735 1.161q.471-.233.905-.524l-.556-.83a7 7 0 0 1-.793.458zm-7.985-.524q.434.292.906.524l.443-.896a7 7 0 0 1-.793-.459zm1.873.925q.493.168 1.011.27l.194-.98a7 7 0 0 1-.884-.237zm4.132.271a8 8 0 0 0 1.012-.27l-.321-.948a7 7 0 0 1-.884.237l.194.98zm-2.083.135a8 8 0 0 0 1.046 0l-.064-.998a7 7 0 0 1-.918 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="btn btn-info p-2 my-2 mx-3"
            id="btnShowProduct"
          >
            Products
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-card-list"
              viewBox="0 0 16 16"
            >
              <path
                d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"
              />
              <path
                d="M5 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 5 8m0-2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m0 5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-1-5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0M4 8a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m0 2.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"
              />
            </svg>
          </button>

          <div class="feature align-content-center">
            <input
              type="search"
              name="search"
              id="searchFilter"
              class="form-control border border-0"
              placeholder="search by id...."
            />
          </div>
        </div>

        <div class="content">
          <!--product Form Start -->
          <div class="container border-start border-2 border-dotted">
            <form enctype="multipart/form-data" id="productForm">
              <fieldset
                class="form-control border-0 bg-secondary bg-opacity-10 border border-info border-start-0 rounded-end"
              >
                <legend
                  class="text-center bg-secondary-subtle p-2 font-monospace"
                  id="pTitle"
                ></legend>
                <div class="formcontent row px-3">
                  <div class="formLeft col-9">
                    <label for="prodName" class="form-label mt-2"
                      >Product Name:</label
                    >
                    <input
                      type="text"
                      name="prodName"
                      id="prodName"
                      class="form-control w-75 border border-dark-subtle border-dotted"
                      required
                    />
                    <label for="prodDesc" class="form-label mt-2"
                      >Description:</label
                    >
                    <textarea
                      name="prodDesc"
                      id="prodDesc"
                      cols="30"
                      rows="6"
                      class="form-control border-dark-subtle w-75 border border-dotted"
                      required
                    ></textarea>
                    <div class="row mt-2">
                      <div class="price col-4">
                        <label for="prodPrice" class="form-label">Price</label>
                        <input
                          type="number"
                          name="prodPrice"
                          id="prodPrice"
                          class="form-control w-50 border border-dark-subtle border-dotted"
                          required
                        />
                      </div>
                      <div class="image col-4">
                        <label for="prodImage" class="form-label">Image</label>
                        <input
                          type="file"
                          name="prodImage"
                          id="prodImage"
                          class="form-control border border-dark-subtle border-dotted"
                        />
                      </div>
                    </div>

                    <button
                      type="button"
                      id="btnSubmit"
                      class="mt-5 mb-4 px-5 btn border border-dotted"
                    >
                      Add
                    </button>
                    <button
                      type="button"
                      id="btnCancel"
                      class="mt-5 mb-4 px-5 btn btn-dark border border-dotted"
                    >
                      Cancel
                    </button>
                  </div>
                  <div class="formRight col-3 align-content-center">
                    <div class="preview border border-dark-subtle border-solid">
                      <img
                        src=""
                        alt=""
                        id="imgView"
                        class="object-fit-cover w-100"
                      />
                    </div>
                  </div>
                </div>
              </fieldset>
            </form>
          </div>
          <!-- Product Form End  -->
          <!-- Display Product Block Start -->
          <div
            class="mx-5 border-start border-2 border-dotted"
            id="productList"
          >
            <select id="sortSelect" class="form-select w-25 my-2">
              <option value="">Sort</option>
              <option value="id-asc">ProductId Asc</option>
              <option value="id-desc">ProductId Desc</option>
              <option value="name-asc">Name Asc</option>
              <option value="name-desc">Name Desc</option>
              <option value="price-asc">Price Asc</option>
              <option value="price-desc">Price Desc</option>
            </select>

            <table class="table table-hover">
              <thead class="table-dark">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Description</th>
                  <th scope="col">Image</th>
                  <th scope="col">Price</th>
                  <th scope="col"></th>
                  <th scope="col"></th>
                </tr>
              </thead>
              <tbody id="prodItems"></tbody>
            </table>
          </div>
          <!-- Display Task Block End  -->
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
